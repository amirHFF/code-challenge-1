spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=x

# Schema is owned by schema.sql (explicit constraints), not generated by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.data.redis.host=x
spring.data.redis.port=6379
spring.data.redis.password=x

# Redis is an optimisation layer only: PostgreSQL row locks + the unique constraint guarantee correctness.
balance.lock.enabled=true
balance.lock.lease=10s
balance.lock.acquire-timeout=3s
balance.idempotency.ttl=24h
